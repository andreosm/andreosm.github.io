<!DOCTYPE html>
<html lang="en" data-page-title="rsvpPageTitle">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Our Celebration</title>

        <!-- Bootstrap -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

        <!-- Site CSS -->
        <link rel="stylesheet" href="/css/site3.css">
    </head>

    <body>

        <!-- POSTCARD FRAME -->

        <div class="postcard-strips-top"></div>
        <div class="postcard-strips-left"></div>
        <div class="postcard-strips-bottom"></div>

        <!-- LEFT SIDE -->
        <img
            id="dateStamp"
            class="postcard-art left-art"
            src="/images/css/postcard-date-bg.png"
            alt=""
        >

        <img
            id="shadowLeaf"
            class="postcard-art left-art"
            src="/images/css/postcard-burned-leaf-bg.png"
            alt=""
        >

        <img
            id="greenLeaf"
            class="postcard-art left-art"
            src="/images/css/postcard-green-leaf-bg.png"
            alt=""
        >


        <!-- CONTENT -->
        <main id="pageContent" class="page-content">
            <h2 id="event-title" class="kaushan-script"></h2>
            <h5 id="rsvp-title"></h5>   
        </main>

        <!-- <main class="container page-content">
            <section class="hero-section">

                <h1>Welcome!</h1>

                <p>
                    Your content will go here.
                </p>

            </section>
        </main> -->


        <!-- RIGHT SIDE -->
        <img
            id="alegriaStamp"
            class="postcard-art right-art"
            src="/images/css/postcard-stamp-bg.png"
            alt=""
        >

        <img
            id="boaMusica"
            class="postcard-art right-art"
            src="/images/css/postcard-tampinha-bg.png"
            alt=""
        >


        <!-- SKYLINE -->
        <img
            id="skyline"
            class="postcard-art skyline"
            src="/images/css/postcard-skyline-bg.png"
            alt=""
        >


        <!-- DESKTOP NAVBAR -->
        <nav id="desktopNav" class="site-nav desktop-nav">

            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link" href="/index.html" id="menu-home">
                        
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="the-party.html" id="menu-party">
                        
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="" id="menu-rsvp">
                        
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="the-venue.html" id="menu-venue">
                        
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="food.html" id="menu-food">
                        
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="beverages" id="menu-beverage">
                    
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="be-a-star.html" id="menu-star">
                        
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="photos.html" id="menu-photos">
                        
                    </a>
                </li>

            </ul>            

            <!-- LANGUAGE SELECTOR -->
            <div class="language-selector">

                <button
                    type="button"
                    class="language-button"
                    data-language="en"
                    aria-label="English">

                    <img src="/images/flags/us.svg" alt="English">

                </button>

                <button
                    type="button"
                    class="language-button"
                    data-language="it"
                    aria-label="Italiano">

                    <img src="/images/flags/it.svg" alt="Italiano">

                </button>

                <button
                    type="button"
                    class="language-button"
                    data-language="pt"
                    aria-label="Português">

                    <img src="/images/flags/br.svg" alt="Português">

                </button>

            </div>

        </nav>


        <!-- HAMBURGER -->
        <button
            id="hamburgerButton"
            class="hamburger-button"
            type="button"
            aria-label="Open navigation"
            aria-expanded="false"
            aria-controls="mobileNav"
        >
            ☰
        </button>


        <!-- MOBILE / HAMBURGER NAVIGATION -->
        <nav
            id="mobileNav"
            class="site-nav mobile-nav"
            aria-hidden="true"
        >

            <button
                id="mobileNavClose"
                class="site-nav mobile-nav-close"
                type="button"
                aria-label="Close navigation"
            >
                &times;
            </button>

            <a href="/">Home</a>
            <a href="/party">The Party</a>
            <a href="/venue">The Venue</a>
            <a href="/food">Food</a>
            <a href="/beverage">Beverage</a>
            <a href="/rsvp">RSVP</a>

            <div class="language-links">
                <!-- your flags -->
            </div>

        </nav>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
        </script>
        
        <script src="/js/resize.js"></script>
        <script type="module" src="/js/language.js"></script>

        <div class="toast-container position-fixed bottom-0 end-0 p-3">

            <div id="languageToast"
                class="toast"
                role="alert"
                aria-live="assertive"
                aria-atomic="true">

                <div class="toast-header">

                    <strong id="languageToastHeader" class="me-auto">
                    </strong>

                    <small id="languageToastTitle">
                    </small>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="toast"
                            aria-label="Close">
                    </button>

                </div>

                <div id="languageToastBody" class="toast-body">
                </div>

            </div>

        </div>
    </body>

</html>
